<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Team Showcase</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
<main class="login-card">
  <h1>Team Showcase</h1>
  <p class="muted">Sign in to continue.</p>
  <form id="loginForm">
    <label>Username <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
    <label>Password <input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <div id="loginError" class="err" role="alert"></div>
    <button class="btn" id="loginBtn">Sign in</button>
  </form>
  <p id="skip" class="muted" hidden><a href="/">Continue without signing in</a></p>
</main>
<script src="/login.js"></script>
</body>
</html>
